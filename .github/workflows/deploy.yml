name: CI/CD Pipeline con DevSecOps

on:
  push:
    branches: [ main ]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install bandit

      - name: Pruebas Unitarias con Pytest
        run: |
          pytest test_app.py

      - name: Escaneo de código fuente con Bandit (SAST)
        run: |
          bandit -r . -f txt

      - name: Construir imagen Docker para análisis
        run: |
          docker build -t app-flask:test .

      - name: Escaneo de vulnerabilidades en Imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-flask:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: security-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Desplegar en la EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            docker compose up -d
